name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reported rather than rewritten, so a formatting slip fails here instead
      # of turning up as noise in someone else's diff.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l src/)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./src/...

      - name: test
        run: go test ./src/...

      - name: atom fmt
        run: go run ./src fmt --check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # CGO off keeps the binary static, so it runs on any distro rather than
      # only ones with a matching libc.
      - name: build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          name=atom
          if [ "$GOOS" = "windows" ]; then name=atom.exe; fi
          go build -ldflags "-s -w -X Atom3/src/misc.Version=ci-${GITHUB_SHA::7}" -o "out/$name" ./src

      # Uploaded so any commit can be downloaded and tried without cutting a tag.
      - uses: actions/upload-artifact@v7
        with:
          name: atom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          retention-days: 14
